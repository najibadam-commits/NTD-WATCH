<title>NTD-WATCH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: two-mode workbench. CHW phone app with a journey rail, and a programme GIS dashboard.
   River blue = water/WASH and primary action. Risk hues are a separate semantic scale. */
:root{
 --bg:#F1F5F8;--surface:#FFFFFF;--surface2:#E7EEF3;--ink:#0C2030;--ink2:#455E6E;--line:#D1DCE4;
 --accent:#0A6A94;--accent-ink:#FFFFFF;--accent-soft:#D5EBF4;
 --low:#1E7745;--low-bg:#DAF1E2;--mod:#855400;--mod-bg:#FBEAC2;--high:#A23600;--high-bg:#FFDFCB;--urg:#9E0F3A;--urg-bg:#F9D7E2;
 --land:#E6EDF0;--landline:#B5C4CE;--river:#8EC3DD;
 --shadow:0 1px 2px rgba(12,32,48,.06),0 6px 20px rgba(12,32,48,.07);
 --f-display:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;
 --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
 --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0A1822;--surface:#102331;--surface2:#183142;--ink:#E4EEF4;--ink2:#9DB4C3;--line:#26414F;
 --accent:#4DB4E0;--accent-ink:#04202D;--accent-soft:#12394D;
 --low:#62CB8C;--low-bg:#10372A;--mod:#EDBB55;--mod-bg:#3A2D0C;--high:#FF9A6B;--high-bg:#442010;--urg:#FF7FA3;--urg-bg:#4A1226;
 --land:#14303F;--landline:#2C4B5C;--river:#2B6E8F;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0A1822;--surface:#102331;--surface2:#183142;--ink:#E4EEF4;--ink2:#9DB4C3;--line:#26414F;
 --accent:#4DB4E0;--accent-ink:#04202D;--accent-soft:#12394D;
 --low:#62CB8C;--low-bg:#10372A;--mod:#EDBB55;--mod-bg:#3A2D0C;--high:#FF9A6B;--high-bg:#442010;--urg:#FF7FA3;--urg-bg:#4A1226;
 --land:#14303F;--landline:#2C4B5C;--river:#2B6E8F;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.15}h2{font-size:17px}h3{font-size:14px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.01em;display:block;line-height:1}
.brand span{font-size:11.5px;color:var(--ink2)}
.demo-pill{font:600 11px var(--f-mono);letter-spacing:.06em;padding:5px 9px;border-radius:99px;background:var(--mod-bg);color:var(--mod);border:1px solid color-mix(in srgb,var(--mod) 35%,transparent)}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;padding:9px 14px;border-radius:9px;font-weight:600;color:var(--ink2);min-height:40px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}

/* core loop */
.loop{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}
.loop button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font:600 11px var(--f-mono);letter-spacing:.05em;color:var(--ink2)}
.loop button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.loop i{color:var(--ink2);font-style:normal;font-size:12px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flat{box-shadow:none}
.card h2{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
.btn.sec{background:var(--surface);color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;border-radius:9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;text-align:left}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field>label,.field>.lbl{font-weight:700;font-size:13px}
.hint{font-size:12px;color:var(--ink2)}
.sel,.inp{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;width:100%}
.sel.sm,.inp.sm{min-height:38px;font-size:13px}
.ro{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--surface2);color:var(--ink2)}
.rb{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--f-mono);letter-spacing:.05em;padding:4px 8px;border-radius:7px;white-space:nowrap}
.rb[data-l=LOW]{background:var(--low-bg);color:var(--low)}
.rb[data-l=MODERATE]{background:var(--mod-bg);color:var(--mod)}
.rb[data-l=HIGH]{background:var(--high-bg);color:var(--high)}
.rb[data-l=URGENT]{background:var(--urg);color:#fff}
.tag{display:inline-flex;font:600 11px var(--f-mono);letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.tag.demo{background:var(--mod-bg);color:var(--mod)}
.tag.ok{background:var(--low-bg);color:var(--low)}
.tag.warn{background:var(--high-bg);color:var(--high)}
.tag.info{background:var(--accent-soft);color:var(--accent)}
.notice{border-radius:10px;padding:10px 12px;font-size:12.5px;background:var(--mod-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--mod) 30%,transparent)}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.notice b{font-weight:700}
.disc{border-left:4px solid var(--accent);background:var(--surface2);padding:10px 12px;border-radius:4px 10px 10px 4px;font-size:12px;color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{height:12px}

/* CHW stage */
.chw{display:grid;grid-template-columns:minmax(0,260px) minmax(0,400px) minmax(0,260px);gap:28px;justify-content:center;padding-top:20px}
.rail,.guide{display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:12px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail li button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:transparent;padding:7px 8px;border-radius:9px;text-align:left;color:var(--ink2)}
.rail li button b{font:600 11px var(--f-mono);width:22px;color:var(--ink2)}
.rail li button[aria-current=true]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.rail li button:hover{background:var(--surface2)}
.phone{width:100%;max-width:400px;height:min(800px,calc(100dvh - 150px));min-height:640px;background:var(--bg);border:8px solid var(--ink);border-radius:36px;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:var(--shadow);justify-self:center}
.pstatus{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px;font:600 12px var(--f-mono);background:var(--surface)}
.net{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font:700 10.5px var(--f-mono);letter-spacing:.05em}
.net i{width:8px;height:8px;border-radius:50%;background:var(--low)}
.net[data-st=off] i{background:var(--high)}.net[data-st=err] i{background:var(--urg)}
.net[data-st=sync] i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.net i{animation:none!important}.spin{animation:none!important}}
.pbar{display:flex;align-items:center;gap:8px;padding:6px 12px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.pbar h2{font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;position:relative;color:var(--ink)}
.ibtn:hover{background:var(--surface2)}
.ibtn .dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--urg);color:#fff;font:700 10px/17px var(--f-mono);text-align:center;padding:0 4px}
.steps{display:flex;gap:4px;padding:0 14px 10px;background:var(--surface)}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.pbody{flex:1;overflow-y:auto;padding:16px 14px 90px;display:flex;flex-direction:column;gap:14px}
.pnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.pnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--ink2);min-height:52px;position:relative}
.pnav button[aria-current=true]{color:var(--accent)}
.pnav .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font:700 9px/15px var(--f-mono);min-width:15px;border-radius:8px;padding:0 4px}
.fab{position:absolute;right:14px;bottom:72px;z-index:5;min-height:52px;padding:0 20px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(10,106,148,.4)}
.hello{font-family:var(--f-display);font-size:23px;line-height:1.1}
.sync{display:flex;align-items:center;gap:10px;border-radius:12px;padding:11px 12px;font:700 11.5px var(--f-mono);letter-spacing:.04em}
.sync[data-st=on]{background:var(--low-bg);color:var(--low)}
.sync[data-st=off]{background:var(--mod-bg);color:var(--mod)}
.sync[data-st=sync]{background:var(--accent-soft);color:var(--accent)}
.sync[data-st=err]{background:var(--urg-bg);color:var(--urg)}
.sync .btn{margin-left:auto}
.sum4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sumc{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left}
.sumc b{font:700 28px var(--f-display);display:block;line-height:1.1}
.sumc span{font-size:12px;color:var(--ink2)}
.cta{min-height:60px;font-size:16px;border-radius:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{opacity:.55}
.sec-h{font:700 11px var(--f-mono);letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;margin:4px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.li .t{flex:1;min-width:0}
.li .t b{display:block}
.riskbig{border-radius:16px;padding:16px;text-align:center}
.riskbig[data-l=LOW]{background:var(--low-bg);color:var(--low)}
.riskbig[data-l=MODERATE]{background:var(--mod-bg);color:var(--mod)}
.riskbig[data-l=HIGH]{background:var(--high-bg);color:var(--high)}
.riskbig[data-l=URGENT]{background:var(--urg);color:#fff}
.riskbig b{display:block;font:800 40px var(--f-display);letter-spacing:.02em;line-height:1.1}
.riskbig span{font:700 11px var(--f-mono);letter-spacing:.1em}
.why li{margin:4px 0}
.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 14px 22px;color:var(--ink2);font-size:13px}
.tl li::before{content:"";position:absolute;left:3px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.tl li::after{content:"";position:absolute;left:7px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--ink)}
.tl li.done::before{background:var(--accent);border-color:var(--accent)}
.tl li b{display:block;font-size:12.5px}
.sheetbg{position:absolute;inset:0;background:rgba(5,15,22,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px 22px;display:flex;flex-direction:column;gap:12px}
.spin{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.login{align-items:stretch;justify-content:center;padding-top:28px}
.empty{text-align:center;padding:28px 12px;color:var(--ink2);border:1.5px dashed var(--line);border-radius:14px}

/* programme */
.prog{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;padding-top:20px}
.side{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:6px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;gap:10px;align-items:center;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--ink2);text-align:left;min-height:42px}
.side nav button:hover{background:var(--surface2)}
.side nav button[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.filters label{font:600 10.5px var(--f-mono);letter-spacing:.05em;color:var(--ink2);display:flex;flex-direction:column;gap:3px;text-transform:uppercase;min-width:120px;flex:1 1 120px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{font:600 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:block}
.kpi b{font:700 30px var(--f-display);display:block;margin:4px 0 2px;line-height:1.05}
.kpi span{font-size:12px;color:var(--ink2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
.tbl tr.sel td{background:var(--accent-soft)}
.hb{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hb .tr{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
.mapbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapsvg{display:block;width:100%;height:auto;touch-action:none;cursor:grab;user-select:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:700 18px var(--f-body);box-shadow:var(--shadow)}
.maplegend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:5px;max-width:230px}
.layers label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-weight:600}
.layers label:last-child{border:0}
.layers input{width:20px;height:20px;accent-color:var(--accent)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mx div{border-radius:10px;padding:9px;font-size:12px;border:1px solid var(--line)}
.mx b{display:block;font-size:12.5px}
.mx .hh{background:var(--urg-bg);color:var(--ink)}.mx .hl{background:var(--high-bg)}.mx .lh{background:var(--accent-soft)}.mx .ll{background:var(--surface2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.emerge{border:1.5px solid var(--urg);background:var(--urg-bg);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.modalbg{position:fixed;inset:0;background:rgba(5,15,22,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal textarea{width:100%;min-height:160px;font:12px/1.5 var(--f-mono);background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:80;font-weight:600;max-width:90vw;box-shadow:var(--shadow)}
.notifp{position:absolute;right:0;top:46px;z-index:30;width:min(340px,80vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px}
.feed{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.feed li{display:flex;gap:10px;font-size:13px}

function facts(d){
 const n=d.symptoms.filter(s=>s!=='None of these').length;
 return {
  symptom_signal:n>=3?3:n,
  persistent:DURS.indexOf(d.duration)>=2,

  exposure:d.contact_water==='Yes'||d.vector==='Yes'||d.animal==='Yes',
  cluster:d.similar_hh==='Yes'||d.similar_comm==='Yes',
  warning_indicator:d.symptoms.some(s=>WARN.includes(s)),
  delayed_care:d.delay==='Yes'
 };
}
function condTxt(c){const [f,o,v]=c;const nm={0:'NONE',1:'LOW',2:'MODERATE',3:'HIGH'};return `${f} ${o==='>='?'≥':'='} ${f==='symptom_signal'?nm[v]:v}`}
function cond(f,c){const [k,o,v]=c;return o==='>='?f[k]>=v:f[k]===v}
function assess(d){
 const f=facts(d),fired=RULES.filter(r=>r.on&&r.when.every(c=>cond(f,c)));
 let level='LOW';fired.forEach(r=>{if(LEVELS.indexOf(r.level)>LEVELS.indexOf(level))level=r.level});
 const why=[];
 if(f.symptom_signal>0)why.push('Relevant symptoms reported ('+d.symptoms.filter(s=>s!=='None of these').length+')');
 if(f.persistent)why.push('Symptoms persistent ('+d.duration.toLowerCase()+')');
 if(f.progression_worse)why.push('Symptoms reported as getting worse');

function washScore(d){
 let p=0;const m=18;
 p+={'River/stream/pond':2,'Open well':1.5,'Vendor/tanker':.5}[d.water_source]||0;
 p+={Rarely:1,Sometimes:.5}[d.reliability]||0;
 p+=d.wtreat==='None'?1:0;
 p+=d.toilet==='No toilet / open defecation'?2:d.toilet==='Shared pit latrine'?1:0;
 p+={'Poor':1,'Not usable':1.5}[d.san_cond]||0;
 p+=d.handwash==='No'?2:d.handwash==='Yes, no water'?1:0;
 p+=d.soap==='Never'?1:d.soap==='Sometimes'?.5:0;
 p+=d.stagnant==='Yes'?1:0;p+=d.breeding==='Yes'?1:0;p+=d.housing==='Poor'?1:0;

 return {score:Math.min(100,s),level:s>=55?'HIGH':s>=30?'MODERATE':'LOW'};
}

 if(f.ward&&f.ward!=='all')l=l.filter(c=>c.ward===f.ward);

const levelsSel=()=>{const r=P().filters.risk;return r==='all'?['low','mod','high','urg']:r==='HIGHER'?['high','urg']:[{LOW:'low',MODERATE:'mod',HIGH:'high',URGENT:'urg'}[r]]};
const catK=c=>{const k=P().filters.cat;return k==='all'?1:c.cat[CATKEYS.indexOf(k)]};
const W=()=>+P().filters.period;
const win=(a,k)=>a.slice(12-W()).map(v=>Math.round(v*k));
function agg(c){
 const k=catK(c),s=x=>sum(win(c[x],k)),o={low:s('low'),mod:s('mod'),high:s('high'),urg:s('urg')},ls=levelsSel();
 o.total=sum(ls.map(x=>o[x]));o.hrAll=o.high+o.urg;o.hrSel=(ls.includes('high')?o.high:0)+(ls.includes('urg')?o.urg:0);return o;

 const lg=[...new Set(cs.map(c=>c.lga))];

 <div class="card"><h2>WASH vulnerability by LGA</h2>${lg.map(i=>{const x=COMM.filter(c=>c.lga===i),s=Math.round(sum(x.map(vscore))/x.length);return hbar(LGAS[i],s,100,lcol(vlevel(s)),s+' · '+vlevel(s))}).join('')}<div class="hint">Average community vulnerability score (0 to 100). Context only; not a cause of disease.</div></div>

 if(m.t==='outcome'){const r=R.find(x=>x.id===m.id);b=`<h2>Record assessment outcome</h2><div class="muted">${r.id} · ${esc(CBY[r.comm].name)}</div><div class="field"><label for="oc">Basic outcome</label><select id="oc" class="sel"><option>Management initiated</option><option>Referred onward</option><option>No further action needed</option><option>Other</option></select></div><div class="hint">Record only the basic outcome. Do not enter clinical details.</div><button class="btn" data-a="ocSave" data-id="${r.id}">Save outcome</button>`}
 if(m.t==='user'){const u=m.id?USERS.find(x=>x.id===m.id):null;b=`<h2>${u?'Edit user':'Create user'}</h2><div class="field"><label for="u-name">Full name</label><input id="u-name" class="inp" value="${esc(u?u.name:'')}"></div><div class="field"><label for="u-con">Phone or email</label><input id="u-con" class="inp" value="${esc(u?u.contact:'')}"></div><div class="field"><label for="u-role">Role</label><select id="u-role" class="sel">${ROLES.map(r=>`<option ${u&&u.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label for="u-geo">Geography</label><select id="u-geo" class="sel">${[STATE,...LGAS.map(l=>l+' LGA')].map(g=>`<option ${u&&u.geo.startsWith(g.replace(' LGA',''))?'selected':''}>${g}</option>`).join('')}</select></div><div class="row wrap"><button class="btn" data-a="userSave" data-id="${u?u.id:''}">${u?'Save changes':'Create user'}</button>${u?`<button class="btn sec" data-a="userReset" data-id="${u.id}">Reset access</button><button class="btn ghost" data-a="userToggle" data-id="${u.id}">${u.status==='Active'?'Disable user':'Enable user'}</button>`:''}</div>`}
 return `<div class="modalbg" data-a="modalx"><div class="modal" data-stop role="dialog" aria-modal="true">${b}<button class="btn sec" data-a="modalx">Close</button></div></div>`;
}

const LOOP=['SIGNAL','ASSESSMENT','ACTION','REFERRAL','FOLLOW-UP','INTELLIGENCE','RESPONSE'];
function loopIdx(){
 if(S.mode==='chw')return LOOPSTAGE[S.chw.screen]!=null?LOOPSTAGE[S.chw.screen]:-1;
 const p=S.prog.page;return p==='referrals'?3:p==='gis'&&(S.prog.selComm||S.prog.selSig)?6:['overview','gis','signals','vuln','trends','reports'].includes(p)?5:-1;
}
function topbar(){
 return `<header class="top"><div class="brand"><div class="logo">${logoSvg(22)}</div><div><b>NTD-WATCH</b><span>Community Health Intelligence</span></div></div><span class="demo-pill">DEMO DATA · MVP v1.0 PROTOTYPE</span><button class="linkbtn" data-a="reset">Reset demo</button><div class="seg" role="group" aria-label="Prototype mode"><button data-a="mode" data-v="chw" aria-pressed="${S.mode==='chw'}">CHW mobile app</button><button data-a="mode" data-v="prog" aria-pressed="${S.mode==='prog'}">Programme dashboard</button></div></header>`;
}
function loopHtml(){const a=loopIdx();return `<nav class="loop" aria-label="Core product loop">${LOOP.map((l,i)=>`${i?'<i>→</i>':''}<button data-a="loop" data-i="${i}" ${i===a?'aria-current="true"':''}>${l}</button>`).join('')}</nav>`}
function render(){
 const app=$('#app'),pb=$('.pbody'),st=pb?pb.scrollTop:0,ae=document.activeElement&&document.activeElement.id;
 const key=S.mode+S.chw.screen+S.prog.page;
 app.innerHTML=topbar()+loopHtml()+(S.mode==='chw'?chwView():progView())+modalHtml();
 const nb=$('.pbody');if(nb)nb.scrollTop=key===S._key?st:0;
 S._key=key;
 if(ae){const e=document.getElementById(ae);if(e&&['SELECT','INPUT'].includes(e.tagName))e.focus({preventScroll:true})}
}
function onBind(path){
 const p=P();
 if(path==='prog.role'){const al=ROLEDEF[p.role].pages;if(!al.includes(p.page))p.page=al[0];p.filters.lga=p.role==='lga'?'1':'all';p.filters.ward='all';p.filters.comm='all';p.view=p.role==='lga'?lgaView(1):[0,0,800,560];p.selComm=p.selSig=p.selFac=null;p.notif=false}
 if(path==='prog.filters.lga'){p.filters.ward='all';p.filters.comm='all';p.view=p.filters.lga==='all'?[0,0,800,560]:lgaView(+p.filters.lga)}
 if(path==='prog.filters.ward')p.filters.comm='all';
 if(path.startsWith('prog.filters')){const ids=scopeComms().map(c=>c.id);['selComm','selSig'].forEach(k=>{if(p[k]&&!ids.includes(p[k]))p[k]=null})}
}
let drag=null;
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('#mapsvg');if(!s||e.button>0)return;drag={x:e.clientX,y:e.clientY,v:P().view.slice(),s,moved:false}});
window.addEventListener('pointermove',e=>{if(!drag)return;const r=drag.s.getBoundingClientRect(),dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(!drag.moved)return;const v=drag.v,nv=[v[0]-dx/r.width*v[2],v[1]-dy/r.height*v[3],v[2],v[3]];P().view=nv;drag.s.setAttribute('viewBox',nv.map(x=>x.toFixed(1)).join(' '))});
window.addEventListener('pointerup',()=>{if(drag&&drag.moved)P()._moved=Date.now();drag=null});
document.addEventListener('click',e=>{
 const t=e.target;if(!t.closest||['SELECT','OPTION'].includes(t.tagName))return;
 const el=t.closest('[data-a]');if(!el)return;
 const stop=t.closest('[data-stop]');if(stop&&!stop.contains(el))return;
 if(t.closest('#mapsvg')&&P()._moved&&Date.now()-P()._moved<300)return;
 const f=A[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.bind){setPath(S,t.dataset.bind,t.value);onBind(t.dataset.bind);render();return}
 if(t.dataset&&t.dataset.a&&t.tagName==='SELECT'&&A[t.dataset.a])A[t.dataset.a](t,e);
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.in)setPath(S,t.dataset.in,t.value)});
const U='Amina Yusuf';
const A={
 mode(el){S.mode=el.dataset.v;render()},
 reset(){location.reload()},
 loop(el){const i=+el.dataset.i;
  if(i<=4){S.mode='chw';cgo(['person','context','result','referral','followups'][i])}

 /* ---- CHW ---- */
 login(){const c=S.chw;if(!c.login.id.trim()||!c.login.pw.trim()){c.err='Enter your phone or email and your password.';return render()}c.err=null;c.user=CHW;audit(CHW.name,'Login',CHW.id,'role: CHW');c.screen='dash';render()},
 forgot(){toast('Reset instructions sent (simulated)')},
 help(){S.chw.sheet={t:'help'};render()},

 back(){const c=S.chw;c.screen=BACK[c.screen]||'dash';c.sheet=null;render()},
 tab(el){const c=S.chw;c.screen=el.dataset.s;c.sheet=null;c.notif=false;render()},
 new(){const c=S.chw,d=c.draft;if(!(d&&!d.saved&&(d.age||d.symptoms.length)))c.draft=BLANK();c.screen='newtype';c.sheet=null;render()},
 resume(){S.chw.screen='person';render()},
 fresh(){S.chw.draft=BLANK();render()},
 pick(el){const d=D(),f=el.dataset.f,v=el.dataset.v;d[f]=v;
  if(f==='contact_water'&&v!=='Yes')d.freq=null;if(f==='toilet'&&v==='No toilet / open defecation')d.san_cond=null;if(f==='treated'&&v!=='Yes')d.treat_where=null;if(f==='delay'&&v!=='Yes')d.delay_reason=null;render()},
 tog(el){const d=D(),f=el.dataset.f,v=el.dataset.v,a=d[f],i=a.indexOf(v);
  if(f==='symptoms'&&v==='None of these'){d[f]=i>=0?[]:['None of these']}
  else{if(f==='symptoms')d[f]=a.filter(x=>x!=='None of these');const b=d[f];const j=b.indexOf(v);j>=0?b.splice(j,1):b.push(v)}
  render()},
 gps(){const d=D();d.gps=gps(CBY[d.community]);render()},
 complete(){completeDraft();S.chw.screen='result';render()},
 saveFollow(){const d=D(),a=d.saved;if(!d.planned){FU.push({id:'FU-'+(FU.length+1),type:a.ref?'referral':'monitor',ref:a.ref,aid:a.id,due:Date.now()+(d.result.level==='MODERATE'?7:3)*DAY,done:false});d.planned=true;audit(CHW.name,'Follow-up created',FU[FU.length-1].id,'planned')}toast('Saved. Follow-up planned.');S.chw.screen='dash';render()},
 saveClose(){toast('Assessment saved and closed');S.chw.screen='dash';render()},
 fac(el){D().fac=el.dataset.id;render()},
 genRef(){const d=D();if(!d.ref)genRef(d.fac);S.chw.screen='refdone';render()},
 toggleNet(){const c=S.chw;if(c.sync==='syncing')return;c.online=!c.online;if(c.online&&(pendingA().length||pendingR().length))startSync();else render()},
 sync(){startSync()},
 simErr(el){S.chw.simErr=el.checked;render()},
 notif(){S.chw.notif=!S.chw.notif;render()},
 notifx(){S.chw.notif=false;render()},
 sheetx(){S.chw.sheet=null;render()},
 openA(el){S.chw.sheet={t:'A',id:el.dataset.id};render()},
 openR(el){S.chw.sheet={t:'R',id:el.dataset.id};render()},
 openFU(el){S.chw.fu={id:el.dataset.id,ans:{}};S.chw.screen='followform';render()},
 fuAns(el){S.chw.fu.ans[el.dataset.f]=el.dataset.v;render()},
 submitFU(){const c=S.chw,f=FU.find(x=>x.id===c.fu.id),a=c.fu.ans;f.done=true;f.result={...a};audit(CHW.name,'Follow-up completed',f.id,'outcome: '+a.outcome);
  const r=f.ref&&R.find(x=>x.id===f.ref);
  if(r&&a.outcome==='Completed'){if(r.stage<5)setStage(r,5,CHW.name)}else if(r&&a.outcome==='Referred onward'&&r.stage<4)setStage(r,4,CHW.name);
  if(a.outcome==='Further follow-up'||(a.more==='Yes'&&a.outcome!=='Completed')){FU.push({id:'FU-'+(FU.length+1),type:f.type,ref:f.ref,aid:f.aid,due:Date.now()+7*DAY,done:false});audit(CHW.name,'Follow-up created',FU[FU.length-1].id,'due in 7 days')}
  toast('Follow-up saved');c.screen='followups';c.fu=null;render()},
 logout(){S.chw.user=null;S.chw.screen='login';render()},

 /* ---- Programme ---- */

  if(k==='reset')p.view=p.filters.lga==='all'&&roleLga()===null?[0,0,800,560]:lgaView(roleLga()!==null?roleLga():+p.filters.lga);

 stab(el){P().stab=el.dataset.v;render()},

 rptPrev(el){P().modal={t:'rpt',id:el.dataset.id};render()},

 copyCsv(){const b=$('#csvbox');b.select();const ok=()=>toast('CSV copied');const no=()=>{b.select();toast('Press Ctrl+C to copy the selected text')};try{navigator.clipboard.writeText(b.value).then(ok,no)}catch(x){no()}},
 userNew(){P().modal={t:'user',id:null};render()},
 userEdit(el){P().modal={t:'user',id:el.dataset.id};render()},
 userSave(el){const n=$('#u-name').value.trim();if(!n){toast('Enter a name');return}

 modalx(){P().modal=null;render()}
